<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Story — TrendNova</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="brand" href="index.html"><b>T</b> Trend<span>Nova</span></a>
    <nav>
      <a href="index.html#latest">Latest</a>
      <a href="index.html#categories">Categories</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main id="story" class="page" aria-live="polite">Loading story…</main>

  <footer>
    <a href="index.html">← TrendNova home</a>
    <small>© TrendNova</small>
  </footer>

  <script>
    const SUPABASE_URL = 'https://urypsodamgpsutdpsdqz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_MaNeb6j9p2l0vSfZaqLEcQ_2a-5EHO';

    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[char]));

    const storyElement = document.getElementById('story');

    function showMessage(title, message) {
      storyElement.innerHTML = `<h1>${esc(title)}</h1><p>${esc(message)}</p><p><a href="index.html#latest">Return to TrendNova stories</a></p>`;
    }

    function getReadTime(content) {
      const words = String(content || '').trim().split(/\s+/).filter(Boolean).length;
      return `${Math.max(1, Math.ceil(words / 200))} min read`;
    }

    function renderContent(content) {
      const paragraphs = Array.isArray(content)
        ? content
        : String(content || '').split(/\r?\n\s*\r?\n|\r?\n/);

      return paragraphs
        .map(paragraph => String(paragraph || '').trim())
        .filter(Boolean)
        .map(paragraph => `<p>${esc(paragraph)}</p>`)
        .join('');
    }

    async function loadStory() {
      const articleId = new URLSearchParams(window.location.search).get('id');
      if (!articleId) {
        showMessage('Story not found', 'This story link is missing its article ID.');
        return;
      }

      try {
        const params = new URLSearchParams({
          select: 'id,title,slug,excerpt,content,image_url,category,author,status,published_at',
          id: `eq.${articleId}`,
          status: 'eq.published',
          limit: '1'
        });

        const response = await fetch(
          `${SUPABASE_URL.replace(/\/$/, '')}/rest/v1/articles?${params.toString()}`,
          {
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`
            }
          }
        );

        if (!response.ok) {
          console.error('TrendNova article request failed:', response.status, await response.text());
          showMessage('Could not load this story', 'Please try again later. If the problem continues, check the Supabase public read permissions for published articles.');
          return;
        }

        const articles = await response.json();
        const article = articles[0];

        if (!article) {
          showMessage('Story not found', 'This story may not be published or the link may be incorrect.');
          return;
        }

        document.title = `${article.title || 'Story'} — TrendNova`;
        const category = article.category || 'TrendNova';
        const imageMarkup = article.image_url
          ? `<img style="width:100%;border-radius:18px" src="${esc(article.image_url)}" alt="${esc(category)} cover" loading="eager">`
          : '';
        const authorMarkup = article.author ? ` · ${esc(article.author)}` : '';

        storyElement.innerHTML = `
          <a href="index.html#latest">← BACK TO STORIES</a>
          <p class="meta">${esc(category)} · ${esc(getReadTime(article.content))}${authorMarkup}</p>
          <h1>${esc(article.title || 'Untitled story')}</h1>
          ${article.excerpt ? `<p>${esc(article.excerpt)}</p>` : ''}
          ${imageMarkup}
          <div class="story-content">${renderContent(article.content)}</div>
          <p><a href="index.html#latest">More stories ↗</a></p>
        `;
      } catch (error) {
        console.error('TrendNova story loading error:', error);
        showMessage('Could not load this story', 'Please check your internet connection and try again.');
      }
    }

    loadStory();
  </script>
</body>
</html>
