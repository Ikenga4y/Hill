<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story — TrendNova</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html"><b>T</b> Trend<span>Nova</span></a><nav><a href="index.html#latest">Latest</a><a href="index.html#categories">Categories</a><a href="about.html">About</a></nav></header><main id="story" class="page">Loading story…</main><footer><a href="index.html">← TrendNova home</a><small>© TrendNova</small></footer><script>const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('content/posts.json').then(r=>r.json()).then(posts=>{let p=posts.find(x=>x.id===new URLSearchParams(location.search).get('id'));if(!p)throw Error();document.title=p.title+' — TrendNova';document.getElementById('story').innerHTML=`<a href="index.html#latest">← BACK TO STORIES</a><p class="meta">${esc(p.category)} · ${esc(p.readTime)}</p><h1>${esc(p.title)}</h1><p>${esc(p.excerpt)}</p><img style="width:100%;border-radius:18px" src="${esc(p.image)}" alt="${esc(p.category)} cover"><div>${(Array.isArray(p.body)?p.body:String(p.body||'').split('\\n')).map(t=>'<p>'+esc(t)+'</p>').join('')}</div><p><a href="index.html">More stories ↗</a></p>`}).catch(()=>document.getElementById('story').innerHTML='<h1>Story not found</h1><a href="index.html">Return home</a>');</script></body></html>
